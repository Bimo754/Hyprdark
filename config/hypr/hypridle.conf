# ==============================================================================
# Hyprdark - Idle Management Daemon (hypridle)
# Power efficiency, screen dimming, and automatic lockscreen triggers.
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Listener 1: Dim screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Listener 2: Lock session after 6 minutes
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# Listener 3: Turn off display after 10 minutes
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
