# ==============================================================================
# Hyprdark - GPU-Accelerated Screen Lock (hyprlock)
# Minimalist, high-contrast dark cyber authentication interface.
# ==============================================================================

background {
    monitor =
    color = rgb(13, 14, 21)
    blur_passes = 2
    blur_size = 5
}

# Current Time Display
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgb(224, 230, 237)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Date Display
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = rgb(122, 130, 158)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgb(230, 57, 70)
    inner_color = rgb(21, 23, 34)
    font_color = rgb(224, 230, 237)
    check_color = rgb(0, 229, 255)
    fail_color = rgb(255, 51, 68)

    fade_on_empty = false
    placeholder_text = <span foreground="##7a829e">AUTHENTICATE [$USER]</span>
    fail_text = <span foreground="##ff3344">ACCESS DENIED ($ATTEMPTS)</span>
    hide_input = false
    rounding = 3

    position = 0, -20
    halign = center
    valign = center
}

# Security Banner
label {
    monitor =
    text = [SYSTEM LOCKED - HYPRDARK PROTOCOL]
    color = rgb(230, 57, 70)
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, -85
    halign = center
    valign = center
}
