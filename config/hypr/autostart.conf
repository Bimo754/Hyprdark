# ==============================================================================
# Hyprdark - Autostart Daemons & Background Services
# ==============================================================================

# Polkit Authentication Agent (Hyprpolkitagent)
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent

# Hyprdark Unified High-Performance Shell (Quickshell Qt6/QML)
exec-once = ~/.config/hypr/scripts/quickshell-launcher.sh

# Clipboard History Management (cliphist + wl-clipboard)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Idle and Screen Lock Management
exec-once = hypridle

# Wallpaper Manager Daemon (Rotates wallpapers every 5 minutes / 300s)
exec-once = ~/.config/hypr/scripts/wallpaper-ctl.sh --daemon 300


