# ==============================================================================
# Hyprdark - Autostart Daemons & Background Services
# ==============================================================================

# Polkit Authentication Agent (Hyprpolkitagent)
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent

# Waybar Status Bar
exec-once = ~/.config/waybar/launch.sh

# Notification Daemon (prefer swaync, fallback to dunst)
exec-once = command -v swaync >/dev/null 2>&1 && swaync || dunst

# Clipboard History Management (cliphist + wl-clipboard)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Idle and Screen Lock Management
exec-once = hypridle

# Wallpaper Daemon (Launches active video wallpaper or static fallback)
exec-once = ~/.config/hypr/scripts/wallpaper-daemon.sh

# GNOME-Style Auto-Hiding Dock (nwg-dock-hyprland)
exec-once = ~/.config/hypr/scripts/dock-daemon.sh

