# ==============================================================================
# Hyprdark - Wayland Environment Variables
# Optimized for performance, dark theme consistency, and hardware acceleration.
# ==============================================================================

# Cursor sizing
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Desktop Environment Identification
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt Theme and Platform overrides (Force dark and Wayland native)
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK / GDK settings
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Electron / Chromium apps (Brave, VSCode/Sublime, Discord) native Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
