# ==============================================================================
# Hyprdark - Visual Design, Input & Animation Engine
# High-contrast dark cyber theme with directional metallic/cyber accents.
# ==============================================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # High-contrast directional electric cyan to cyber crimson gradient
    col.active_border = rgba(00e5ffee) rgba(e63946ee) 45deg
    col.inactive_border = rgba(1e2233aa)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10

    active_opacity = 0.98
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        contrast = 0.95
        brightness = 0.85
        noise = 0.015
    }
}

animations {
    enabled = true

    # Clean, low-latency industrial easing (no bouncy or floating delays)
    bezier = cyberSnap, 0.05, 0.95, 0.1, 1.0
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 3, cyberSnap, popin 85%
    animation = windowsOut, 1, 3, cyberSnap, popin 85%
    animation = border, 1, 4, linear
    animation = fade, 1, 3, cyberSnap
    animation = workspaces, 1, 3, cyberSnap, slide
    animation = specialWorkspace, 1, 3, cyberSnap, slidevert
}

input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0d0e15
    focus_on_activate = true
}
