# ==============================================================================
# Hyprdark - Keybindings & Workflow Shortcuts
# Clean, ergonomic shortcuts optimized for navigation and cybersecurity tasks.
# ==============================================================================

$mainMod = SUPER

# --- Core Application Launchers ---
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, S, exec, $editor
bind = $mainMod, O, exec, ~/.config/rofi/scripts/cyber-menu.sh

# --- Window State Controls ---
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglesplit

# --- Cybersecurity Scratchpad (Quake Terminal) ---
# Press Super + ` (Grave / Tilde) for instant dropdown terminal anywhere
bind = $mainMod, GRAVE, togglespecialworkspace, scratchpad

# --- Session & Security ---
bind = $mainMod, X, exec, wlogout
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, M, exit

# --- Clipboard History Search ---
bind = $mainMod, C, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/theme.rasi -p "CLIP" | cliphist decode | wl-copy

# --- Notification Center Drawer ---
bind = $mainMod, N, exec, swaync-client -t -sw

# --- Screenshot Pipeline (Grim + Slurp + Swappy) ---
# Fullscreen to clipboard
bind = , PRINT, exec, grim - | wl-copy
# Area crop with Swappy editor / annotation
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
# Area crop saved to Pictures folder
bind = $mainMod, PRINT, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# --- Hardware Media & Brightness Controls ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Window Focus Navigation (Arrows + Vim) ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# --- Window Movement in Tiling (Arrows + Vim) ---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# --- Workspace Switching (1 - 10) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Move Focused Window to Workspace (1 - 10) ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Relative Workspace Switching (Previous / Next) ---
bind = CTRL ALT, left, workspace, m-1
bind = CTRL ALT, right, workspace, m+1
bind = CTRL ALT SHIFT, left, movetoworkspace, m-1
bind = CTRL ALT SHIFT, right, movetoworkspace, m+1

# --- Whole Workspace Migration (All Windows to Previous / Next) ---
bind = CTRL SUPER, left, exec, hyprctl eval "local ws = hl.get_active_workspace(); if ws and ws.id and ws.id > 1 then local t = ws.id - 1; for _, w in ipairs(ws:get_windows()) do hl.dispatch(hl.dsp.window.move({ window = w, workspace = t })) end; hl.dispatch(hl.dsp.focus({ workspace = t })) end"
bind = CTRL SUPER, right, exec, hyprctl eval "local ws = hl.get_active_workspace(); if ws and ws.id and ws.id < 10 then local t = ws.id + 1; for _, w in ipairs(ws:get_windows()) do hl.dispatch(hl.dsp.window.move({ window = w, workspace = t })) end; hl.dispatch(hl.dsp.focus({ workspace = t })) end"


# --- Mouse Window Interactions ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
