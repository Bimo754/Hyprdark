# ==============================================================================
# Hyprdark - Window & Layer Rules
# Rules for dialogs, security tools, floating utilities, and scratchpads.
# ==============================================================================

# --- Utility Dialogs & System Popups (Floating) ---
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(swappy)$
windowrulev2 = float, class:^(hyprpolkitagent)$
windowrulev2 = float, title:^(Open File)(.*)$
windowrulev2 = float, title:^(Save File)(.*)$
windowrulev2 = float, title:^(Confirm to replace files)(.*)$
windowrulev2 = float, title:^(File Operation Progress)(.*)$

# --- Quake Scratchpad Terminal (Super + `) ---
workspace = special:scratchpad, on-created-empty:kitty --class=scratchpad-term
windowrulev2 = float, class:^(scratchpad-term)$
windowrulev2 = size 85% 65%, class:^(scratchpad-term)$
windowrulev2 = center, class:^(scratchpad-term)$
windowrulev2 = animation slidevert, class:^(scratchpad-term)$

# --- Terminal Opacity Tuning (Subtle dark translucency) ---
windowrulev2 = opacity 0.95 0.88, class:^(kitty)$
windowrulev2 = opacity 0.96 0.90, class:^(thunar)$

# --- Media & Picture-in-Picture ---
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# --- Cybersecurity / Pentest Tool Windows ---
windowrulev2 = float, class:^(burp-StartBurp)$, title:^(.*Preferences.*|.*Options.*|.*Alerts.*)$
windowrulev2 = float, class:^(Wireshark)$, title:^(Preferences|Capture Filter.*|Capture Options.*)$

# --- Layer Rules (Waybar & Dropdowns) ---
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, hyprdark-calendar
layerrule = ignorezero, hyprdark-calendar
layerrule = animation slide top, hyprdark-calendar
layerrule = blur, hyprdark-toast
layerrule = ignorezero, hyprdark-toast
layerrule = animation slide top, hyprdark-toast

