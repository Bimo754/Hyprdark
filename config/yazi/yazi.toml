# ==============================================================================
# Hyprdark - Yazi CLI File Manager Configuration
# Fast, asynchronous Rust terminal file manager with Kitty graphics protocol.
# ==============================================================================

[manager]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1920
max_height      = 1080
image_filter    = "lanczos3"
image_quality   = 90
sixel_fraction  = 15

[opener]
edit = [
    { run = 'subl "$@"', orphan = true, desc = "Sublime Text" },
    { run = 'nano "$@"', block = true, desc = "Nano" }
]
open = [
    { run = 'xdg-open "$@"', desc = "Default App" }
]
media = [
    { run = 'mpv "$@"', orphan = true, desc = "MPV Player" }
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = "media" },
    { mime = "audio/*", use = "media" },
    { mime = "application/json", use = "edit" },
    { name = "*", use = "open" }
]
